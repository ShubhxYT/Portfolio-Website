<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>Ask about Shubh · AI portfolio assistant</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="terminal" aria-labelledby="terminal-title">
    <header class="terminal-header">
      <span aria-hidden="true" class="lights">● ● ●</span>
      <h1 id="terminal-title">shubh@somani: ~/ask</h1>
      <button id="clear" type="button">Clear chat</button>
    </header>
    <section class="intro">
      <h2>Hey, ask me about Shubh.</h2>
      <p>I’m an AI assistant, grounded in his public portfolio. Answers can be imperfect. Messages are sent to a model provider; please avoid private information.</p>
      <div class="starters" aria-label="Starter questions">
        <button type="button" data-question="Tell me about your projects.">Projects</button>
        <button type="button" data-question="Compare FullRag-Plus and Youtube-To-Posts.">Compare two projects</button>
        <button type="button" data-question="What technologies does Shubh use?">Tech stack</button>
      </div>
    </section>
    <section id="output" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation" tabindex="0"></section>
    <p id="status" role="status" aria-live="polite">Ready. Type a question, or use help.</p>
    <button id="retry" type="button" hidden>Retry last question</button>
    <form id="chat-form">
      <label for="command-input">Question or command (help, clear, resume)</label>
      <div class="input-line"><span aria-hidden="true">➜</span>
        <input id="command-input" name="message" type="text" maxlength="2000" autocomplete="off" required>
        <button id="send" type="submit">Send</button>
      </div>
    </form>
    <footer>
      <a href="/" target="_top">← Portfolio</a>
      <a id="resume-download" href="/Shubh_Somani_CV_2026.pdf" download>Download resume PDF</a>
      <a href="https://github.com/ShubhxYT" target="_blank" rel="noopener noreferrer">GitHub</a>
    </footer>
  </main>
</body>
</html>
